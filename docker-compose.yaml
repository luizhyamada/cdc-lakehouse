name: lakehouse-stack

services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${db_user}"
      POSTGRES_PASSWORD: "${db_password}"
      POSTGRES_DB: "${db_name}"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/cdc/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - data-platform

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data-platform

  connect:
    build:
      context: .
      dockerfile: infra/cdc/connect.dockerfile
    container_name: debezium-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx768M"
    networks:
      - data-platform

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - data-platform

  setup:
    env_file:
      - .env
    image: curlimages/curl:latest
    container_name: cdc-setup
    depends_on:
      - connect
    restart: "no"
    volumes:
      - ./infra/cdc/postgres-connector.json:/postgres-connector.json
      - ./infra/cdc/entrypoint.sh:/entrypoint.sh
    entrypoint: ["sh", "/entrypoint.sh"]
    networks:
      - data-platform

  generator:
    profiles:
      - generator
    build:
      context: .
      dockerfile: infra/cdc/cdc.dockerfile
    container_name: cdc-generator
    env_file:
      - .env
    depends_on:
      - postgres
    command: python /app/seed/generator/main.py
    networks:
      - data-platform

  spark-master:
    build:
      context: .
      dockerfile: infra/spark/spark.Dockerfile
    image: spark-cdc
    container_name: spark-master
    hostname: spark-master
    env_file:
      - .env
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8090:8080"
    environment:
      SPARK_HOME: /opt/spark
      SPARK_MASTER_IP: 0.0.0.0 
      SPARK_MASTER_PORT: 7077
      AWS_ACCESS_KEY_ID: ${aws_access_key_id}
      AWS_SECRET_ACCESS_KEY: ${aws_secret_access_key}
      AWS_DEFAULT_REGION: ${aws_default_region}
    volumes:
      - ./src:/app/src
      - ./metastore:/opt/spark/metastore
    networks:
      - spark-net
      - data-platform

  spark-worker-1:
    image: spark-cdc
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: >
          bash -c "
            until bash -c 'echo > /dev/tcp/spark-master/7077';
            do
              echo 'Waiting for Spark Master...';
              sleep 2;
            done;

            exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
          "
    ports:
      - "8091:8081"
    environment:
      SPARK_HOME: /opt/spark
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_LOCAL_HOSTNAME: spark-worker-1
      AWS_ACCESS_KEY_ID: ${aws_access_key_id}
      AWS_SECRET_ACCESS_KEY: ${aws_secret_access_key}
      AWS_DEFAULT_REGION: ${aws_default_region}
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./src:/app/src
      - ./metastore:/opt/spark/metastore 
    networks:
      - spark-net
      - data-platform
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/7077"]
      interval: 5s
      timeout: 3s
      retries: 30

  spark-worker-2:
    image: spark-cdc
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: >
          bash -c "
            until bash -c 'echo > /dev/tcp/spark-master/7077';
            do
              echo 'Waiting for Spark Master...';
              sleep 2;
            done;

            exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
          "
    ports:
      - "8092:8081"
    environment:
      SPARK_HOME: /opt/spark
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_LOCAL_HOSTNAME: spark-worker-2
      AWS_ACCESS_KEY_ID: ${aws_access_key_id}
      AWS_SECRET_ACCESS_KEY: ${aws_secret_access_key}
      AWS_DEFAULT_REGION: ${aws_default_region}
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./src:/app/src
      - ./metastore:/opt/spark/metastore 
    networks:
      - spark-net
      - data-platform

networks:
  spark-net:
    driver: bridge
  data-platform:
    driver: bridge

volumes:
  postgres_data:
  kafka_data: